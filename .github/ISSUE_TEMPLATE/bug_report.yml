name: Bug report
description: Something behaves differently from what the documentation says.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the event stream of one bad turn if the bug is about turn taking or audio.
      placeholder: |
        sentence ...
        audio idx=0 i=0 ...
        done ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Command, provider setup and the knob values you were running with.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: extras
    attributes:
      label: Which extras are installed
      multiple: true
      options:
        - vad
        - web
        - cli
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: Windows 11 / Python 3.11.9
