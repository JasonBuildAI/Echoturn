name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: publish guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove the guard can fail
        run: python scripts/check_privacy.py --self-test
      - name: Scan tracked files and commit messages
        run: python scripts/check_privacy.py
      - name: Warn about CJK outside the Chinese README (never fails)
        run: python scripts/check_language.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff>=0.5"
      - run: ruff check .

  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check every module parses
        run: |
          for file in clients/*.js; do node --check "$file"; done
      - name: Run the client suite
        run: |
          shopt -s nullglob
          files=(clients/tests/*.test.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no client tests matched; refusing to report success" >&2
            exit 1
          fi
          node --test "${files[@]}"

  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the package the way a user does
        run: python -m pip install .
      - name: Run a turn with no key, no network and no model files
        working-directory: /tmp
        run: |
          printf 'hello from the offline demo\n' | echoturn-demo --mock --no-play > turn.txt
          cat turn.txt
          grep -q "assistant>" turn.txt || {
            echo "the demo produced no reply; refusing to report success" >&2
            exit 1
          }
      - name: Check that the optional models are reported as missing
        working-directory: /tmp
        run: |
          if echoturn-fetch-models --check; then
            echo "models appeared from nowhere; the check is not checking" >&2
            exit 1
          fi

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run the offline suite
        run: python -m pytest
