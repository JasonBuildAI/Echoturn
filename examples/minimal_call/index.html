<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echoturn - minimal call</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 16px/1.5 system-ui, sans-serif;
    margin: 0 auto; max-width: 40rem; padding: 1.5rem;
    display: flex; flex-direction: column; gap: .75rem; height: 100vh;
    box-sizing: border-box;
  }
  h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  #bar { display: flex; gap: .5rem; align-items: center; }
  #state { margin-left: auto; font-size: .85rem; opacity: .7; }
  #meter { height: .35rem; border-radius: .2rem; background: #00000018; overflow: hidden; }
  #needle { display: block; height: 100%; width: 0; background: currentColor; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; }
  .said, .answered, .broke {
    padding: .5rem .75rem; border-radius: .75rem; max-width: 85%;
    white-space: pre-wrap; word-break: break-word;
  }
  .said { align-self: flex-end; background: #2b6cb0; color: #fff; }
  .answered { align-self: flex-start; background: #00000010; }
  .broke { align-self: center; font-size: .85rem; opacity: .7; }
  form { display: flex; gap: .5rem; }
  textarea { flex: 1; font: inherit; padding: .5rem; resize: none; }
  button { font: inherit; padding: .5rem 1rem; }
</style>
</head>
<body>
<h1>Echoturn - minimal call</h1>
<div id="bar">
  <button id="call" type="button">Start call</button>
  <button id="mute" type="button" disabled>Mute</button>
  <span id="state">idle</span>
</div>
<div id="meter"><i id="needle"></i></div>
<div id="log"></div>
<form id="composer">
  <textarea id="text" rows="1" placeholder="Speak, or type here and press enter"></textarea>
  <button type="submit">Send</button>
</form>

<script type="module">
// Everything about how a turn is taken - when a pause ends it, what counts as
// talking over the reply, what order the audio comes back in - is in the client
// this page imports. What is left here is a page: a place to show the words, a
// place to show the level, and two buttons. There is deliberately no number in
// this file, because a page that holds its own copy of a threshold is a page
// that keeps using it after the service has changed.
import { Call, meterValue } from "/client/echoturn-client.js";

const log = document.getElementById("log");
const callButton = document.getElementById("call");
const muteButton = document.getElementById("mute");
const stateLabel = document.getElementById("state");
const needle = document.getElementById("needle");
const form = document.getElementById("composer");
const text = document.getElementById("text");

let bubble = null;

function line(className, content = "") {
  const element = document.createElement("div");
  element.className = className;
  element.textContent = content;
  log.appendChild(element);
  log.scrollTop = log.scrollHeight;
  return element;
}

const call = new Call({
  session: "demo",
  onState: (state) => {
    stateLabel.textContent = state;
    // The one state that means a person can be heard over the top of the reply.
    needle.style.opacity = state === "speaking" ? "0.4" : "1";
  },
  onTurn: (message) => line("said", message),
  onSubtitle: (sentence, index) => {
    // One bubble per message: the index is what tells a new reply from the next
    // sentence of the one on screen.
    if (!bubble || bubble.dataset.index !== String(index)) {
      bubble = line("answered");
      bubble.dataset.index = String(index);
    }
    bubble.textContent += sentence;
  },
  onLevel: (rms) => {
    needle.style.width = `${Math.round(meterValue(rms) * 100)}%`;
  },
  onNotice: (message) => line("broke", message),
});

callButton.addEventListener("click", async () => {
  if (call.started) {
    call.stop();
    callButton.textContent = "Start call";
    muteButton.disabled = true;
    return;
  }
  // Opening the microphone is the gesture the audio context needs, so it
  // happens here rather than on load.
  if (await call.start()) {
    callButton.textContent = "Hang up";
    muteButton.disabled = false;
  }
});

muteButton.addEventListener("click", () => {
  const muted = !call.muted;
  call.setMuted(muted);
  muteButton.textContent = muted ? "Unmute" : "Mute";
});

form.addEventListener("submit", async (submit) => {
  submit.preventDefault();
  const message = text.value.trim();
  if (!message) return;
  text.value = "";
  // The same conversation either way: a typed turn and a spoken one differ in
  // how they arrived, not in what the pipeline does with them.
  await call.say(message);
});
</script>
</body>
</html>
